# Static JBrowse 2. No X-Frame-Options header is set on purpose: InterMine
# report pages embed this site in an iframe.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # static/ files carry a content hash in their names and change with the
    # image, so they can be cached hard.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything the deployment edits or regenerates is revalidated so a new
    # config or plugin shows up at once. They are also readable from other
    # origins so a JBrowse 2 hosted elsewhere can load this config and plugin.
    location = /config.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
    location = /jbrowse-plugin-intermine.umd.production.min.js {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
}
